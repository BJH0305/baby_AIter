<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>베이비 AI터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="app">
    <section class="screen" data-screen="home">
      <header class="topbar"><h1>베이비 AI터</h1></header>
      <main class="content">
        <div class="section card"><h2 class="title-md">아이 프로필</h2><form id="profileForm"><div class="field"><label class="label" for="profileName">가명</label><input class="input" id="profileName" required maxlength="30" /></div><div class="field"><label class="label" for="profileAge">개월 수</label><input class="input" id="profileAge" type="number" min="1" max="120" required /></div><button class="btn btn-secondary" type="submit">저장</button></form></div>
        <div class="section card"><h2 class="title-md">이번 주 시도한 지도법</h2><p id="weeklyCount"></p></div>
        <div class="section"><h2 class="title-md">진행 중 상담</h2><div id="currentSummary"></div></div>
        <div class="section"><h2 class="title-md">최근 기록</h2><div id="homeRecent"></div></div>
      </main>
    </section>
    <section class="screen" data-screen="ask" hidden>
      <header class="topbar"><h1>상담하기</h1></header>
      <main class="content">
        <form id="askForm">
          <div class="field"><span class="label">대상</span><div class="chips" id="targetChips"><button type="button" class="chip on" data-value="친구">친구</button><button type="button" class="chip" data-value="동생">동생</button></div></div>
          <div class="field"><span class="label">상황</span><div class="chips" id="situationChips"><button type="button" class="chip on" data-value="장난감 다툼">장난감 다툼</button><button type="button" class="chip" data-value="동생을 안고 있을 때">동생을 안고 있을 때</button><button type="button" class="chip" data-value="피곤·졸릴 때">피곤·졸릴 때</button><button type="button" class="chip" data-value="흥분했을 때">흥분했을 때</button><button type="button" class="chip" data-value="이유 모름">이유 모름</button></div></div>
          <div class="field"><label class="label" for="askText">상황 설명</label><textarea class="textarea" id="askText" placeholder="상황을 짧게 적어 주세요"></textarea></div>
          <p class="muted section" id="askAge"></p>
          <button class="btn btn-primary btn-block" type="submit">분석하기</button>
        </form>
        <div id="askLoading" hidden aria-live="polite"><p>분석하고 있어요</p><div class="skeleton" style="height:80px"></div></div>
      </main>
    </section>
    <section class="screen" data-screen="result" hidden>
      <header class="topbar"><a class="icon-btn" href="#ask" aria-label="뒤로"><i data-lucide="chevron-left"></i></a><h1>결과</h1></header>
      <main class="content" id="resultContent"><div class="empty"><p>아직 상담 결과가 없어요</p><a class="btn btn-secondary" href="#ask">상담하기</a></div></main>
    </section>
    <section class="screen" data-screen="log" hidden>
      <header class="topbar"><h1>기록</h1></header>
      <main class="content"><h2 class="title-lg">기록</h2></main>
    </section>
    <nav class="tabbar" id="tabbar" aria-label="주 메뉴">
      <a href="#home" data-tab="home"><i data-lucide="house"></i>홈</a>
      <a href="#ask" data-tab="ask"><i data-lucide="message-circle"></i>상담하기</a>
      <a href="#log" data-tab="log"><i data-lucide="list"></i>기록</a>
    </nav>
  </div>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet"><div id="sheetBody"></div><button class="btn btn-ghost btn-block" id="sheetClose">닫기</button></div>
  <div class="toast" id="toast"></div>
  <script src="js/data.js"></script>
  <script src="js/knowledge.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
