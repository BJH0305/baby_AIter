<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>베이비 AI터</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#f7f6f1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="css/styles.css?v=persona-final" />
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="app">
    <section class="screen" data-screen="home">
      <header class="topbar"><h1>베이비 AI터</h1></header>
      <main class="content">
        <div class="section card"><h2 class="title-md">아이 프로필</h2><p id="profileSummary"></p><button class="btn btn-secondary" id="editProfile" type="button">수정</button></div>
        <div class="section"><button class="btn btn-primary btn-block" type="button" data-start-quiz>검사 시작하기</button></div>
        <div class="section"><h2 class="title-md">최근 검사</h2><div id="homeRecent"></div></div>
      </main>
    </section>
    <section class="screen" data-screen="ask" hidden>
      <header class="topbar"><h1>깨물기 상황 질문</h1></header>
      <main class="content">
        <form id="askForm">
          <p class="muted section" id="askAge"></p>
          <div id="questionContent" aria-live="polite"></div>
          <div class="field" id="quizNote" hidden><label class="label" for="askText">추가 메모 (선택)</label><input class="input" id="askText" maxlength="300" placeholder="특별한 상황이 있으면 적어 주세요" /></div>
          <div class="section"><button class="btn btn-secondary" id="quizBack" type="button" hidden>이전 질문</button></div>
          <button class="btn btn-primary btn-block" id="quizNext" type="button" disabled>다음</button>
          <button class="btn btn-primary btn-block" id="quizSubmit" type="submit" hidden>원인 후보 보기</button>
        </form>
        <div id="askLoading" hidden aria-live="polite"><p>분석하고 있어요</p><div class="skeleton" style="height:80px"></div></div>
      </main>
    </section>
    <section class="screen" data-screen="result" hidden>
      <header class="topbar"><a class="icon-btn" href="#ask" aria-label="뒤로"><i data-lucide="chevron-left"></i></a><h1>결과</h1></header>
      <main class="content" id="resultContent"><div class="empty"><p>아직 검사 결과가 없어요</p><a class="btn btn-secondary" href="#ask">질문 검사</a></div></main>
    </section>
    <section class="screen" data-screen="log" hidden>
      <header class="topbar"><h1>기록</h1></header>
      <main class="content"><div id="logContent"></div></main>
    </section>
    <nav class="tabbar" id="tabbar" aria-label="주 메뉴">
      <a href="#home" data-tab="home"><i data-lucide="house"></i>홈</a>
      <a href="#ask" data-tab="ask"><i data-lucide="message-circle"></i>질문 검사</a>
      <a href="#log" data-tab="log"><i data-lucide="list"></i>기록</a>
    </nav>
  </div>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet"><div id="sheetBody"></div><button class="btn btn-ghost btn-block" id="sheetClose">닫기</button></div>
  <div class="toast" id="toast"></div>
  <script src="js/knowledge.js?v=persona-final"></script>
  <script src="js/config.js?v=persona-final"></script>
  <script src="js/questions.js?v=persona-final"></script>
  <script src="js/ai.js?v=persona-final"></script>
  <script src="js/app.js?v=persona-final"></script>
</body>
</html>
