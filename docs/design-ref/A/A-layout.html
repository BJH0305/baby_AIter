<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>베이비 AI터 시안 v2</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;color:var(--ink);font-size:16px;line-height:1.6;min-height:100vh;background:var(--bg);-webkit-font-smoothing:antialiased}
/* 공통 토큰: 간격 8 배수, 굵기 2종(400/700), 강조색 1개 + 중립색 */
.A{--bg:linear-gradient(135deg,#f1f5f0 0%,#eaf0f1 100%);--ink:#1d2a24;--muted:#5f6e66;--accent:#2f6a52;--soft:#e2ede5;--soft2:#f3f7f3;--card:#ffffffd9;--line:#dbe4dd;--warn:#fff6ea;--warnline:#efcf9e;--warnink:#8a5a12;--r:24px}
.B{--bg:#f4f7f6;--ink:#16211d;--muted:#5f6b67;--accent:#2f9461;--soft:#e4f3ea;--soft2:#f6faf8;--card:#fff;--line:#e3e9e6;--warn:#fff2f1;--warnline:#f1beb8;--warnink:#9a3a2f;--r:20px}
.C{--bg:linear-gradient(180deg,#f1edff 0%,#f9f8ff 60%,#fff 100%);--ink:#211b3a;--muted:#655f84;--accent:#6447e8;--soft:#ece8ff;--soft2:#f7f5ff;--card:#ffffffe6;--line:#e4defa;--warn:#fff4f6;--warnline:#f3c0cf;--warnink:#9b2f52;--r:24px}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.badge.sm{width:36px;height:36px;border-radius:12px}.badge.sm .ic{width:18px;height:18px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:24px 64px}
.logo{font-weight:700;font-size:20px;display:flex;gap:10px;align-items:center}
.logo .mark{width:36px;height:36px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center}
.menu{display:flex;gap:8px}.menu a{display:flex;gap:8px;align-items:center;padding:8px 16px;border-radius:999px;color:var(--muted);font-size:15px}.menu a.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 0 var(--line)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 24px;font-weight:700;font-size:16px;font-family:inherit}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.B .btn{border-radius:14px}
.wrap{max-width:1160px;margin:0 auto;padding:0 64px 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.A .card{box-shadow:0 12px 32px rgba(47,106,82,.06)}.C .card{box-shadow:0 16px 48px rgba(100,71,232,.08)}
.muted{color:var(--muted)}.small{font-size:14px}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:700}
.chip{display:inline-flex;gap:8px;align-items:center;padding:10px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:15px;margin:0 8px 8px 0}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
h1{font-size:52px;line-height:1.2;letter-spacing:-.03em;margin:16px 0;font-weight:700}
.A h1{font-weight:400}.A h1 b{font-weight:700}
h1 em{font-style:normal;color:var(--accent)}
.lead{font-size:18px;color:var(--muted);max-width:500px;margin:0}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding:24px 0 48px}
.row{display:flex;gap:12px;align-items:center}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step{display:flex;gap:16px;align-items:flex-start}.step b{display:block;font-size:17px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:40px 0 16px}.sec h3{margin:0;font-size:20px}
.recent{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.rc{display:flex;gap:16px;align-items:center}.rc .t{font-weight:700;white-space:nowrap;font-size:15px}
/* 홈 일러스트(A): 아이 정보 + 원인 유형 아이콘 궤도 */
.orbit{position:relative;width:360px;height:360px;margin:auto}
.orbit .ring{position:absolute;inset:0;border-radius:50%;border:1px solid #c9d8cd}
.orbit .ring.in{inset:56px;border-style:dashed;border-color:#d3dfd6}
.orbit .core{position:absolute;inset:118px;border-radius:50%;background:#fff;box-shadow:0 16px 40px rgba(47,106,82,.16);display:grid;place-items:center;text-align:center}
.orbit .core b{font-size:20px}.orbit .node{position:absolute;transform:translate(-50%,-50%)}
.orbit .node .badge{background:#fff;box-shadow:0 8px 24px rgba(47,106,82,.14)}
.orbit .lbl{position:absolute;top:50px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;color:var(--muted)}
/* 질문 미리보기 */
.q{padding:24px}.bar{height:6px;background:var(--line);border-radius:9px;margin:12px 0 20px}.bar i{display:block;height:100%;width:25%;background:var(--accent);border-radius:9px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;margin-top:8px;background:#fff;font-size:15px}
.opt.on{border-color:var(--accent);background:var(--soft2);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .chk{margin-left:auto;color:var(--accent)}
/* 결과 */
.rh{display:flex;justify-content:space-between;align-items:flex-end;margin:8px 0 24px}
.rh h2{font-size:34px;margin:8px 0 4px;letter-spacing:-.02em}
.alert{background:var(--warn);border:1px solid var(--warnline);color:var(--warnink);border-radius:16px;padding:16px 20px;display:flex;gap:12px;align-items:center;margin-bottom:16px;font-size:15px}
.alert b{color:var(--warnink)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.cause .top{display:flex;gap:12px;align-items:center;margin-bottom:16px}.cause h4{margin:0;font-size:19px}
.rank{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.why{font-size:15px;padding:12px 16px;border-radius:14px;background:var(--soft2);border:1px solid var(--line);margin:8px 0 16px}
.lab{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}.lab .ic{width:14px;height:14px}
.tips{list-style:none;padding:0;margin:8px 0 16px}.tips li{display:flex;gap:8px;font-size:15px;margin:8px 0}.tips .ic{width:18px;height:18px;color:var(--accent);margin-top:3px}
.src{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}.src .ic{width:16px;height:16px}
.side{display:grid;grid-template-columns:288px 1fr;gap:24px;align-items:start}
.ans li{list-style:none;display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.ans ul{padding:0;margin:8px 0 0}
.ans .badge{width:32px;height:32px;border-radius:10px}.ans .badge .ic{width:16px;height:16px}
.fb{display:flex;gap:16px;align-items:center;margin-top:16px;padding:16px 24px}.fb .chip{margin:0}
.folded{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:16px 24px}
/* C 플로팅 */
.stage{position:relative;height:400px}.float{position:absolute;background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 14px 40px rgba(100,71,232,.16);font-size:13px;display:flex;gap:8px;align-items:center}.float .ic{width:16px;height:16px;color:var(--accent)}
.disc{font-size:13px;color:var(--muted);margin-top:24px;display:flex;gap:8px;align-items:center}.disc .ic{width:16px;height:16px}
</style></head>
<body><div id="app"></div>
<script>
const P={
msg:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
home:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
list:'<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
baby:'<path d="M9 12h.01"/><path d="M15 12h.01"/><path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/><path d="M19 6.3a9 9 0 0 1 1.8 3.9 2 2 0 0 1 0 3.6 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5s-.9 2.5-2 2.5c-.8 0-1.5-.4-1.5-1"/>',
puzzle:'<path d="M19.439 7.85c-.049.322.059.648.289.878l1.568 1.568c.47.47.706 1.087.706 1.704s-.235 1.233-.706 1.704l-1.611 1.611a.98.98 0 0 1-.837.276c-.47-.07-.802-.48-.968-.925a2.501 2.501 0 1 0-3.214 3.214c.446.166.855.497.925.968a.979.979 0 0 1-.276.837l-1.61 1.61a2.404 2.404 0 0 1-1.705.707 2.402 2.402 0 0 1-1.704-.706l-1.568-1.568a1.026 1.026 0 0 0-.877-.29c-.493.074-.84.504-1.02.968a2.5 2.5 0 1 1-3.237-3.237c.464-.18.894-.527.967-1.02a1.026 1.026 0 0 0-.289-.877l-1.568-1.568A2.402 2.402 0 0 1 1.998 12c0-.617.236-1.234.706-1.704L4.23 8.77c.24-.24.581-.353.917-.303.515.077.877.528 1.073 1.01a2.5 2.5 0 1 0 3.259-3.259c-.482-.196-.933-.558-1.01-1.073-.05-.336.062-.676.303-.917l1.525-1.525A2.402 2.402 0 0 1 12 1.998c.617 0 1.234.236 1.704.706l1.568 1.568c.23.23.556.338.877.29.493-.074.84-.504 1.02-.968a2.5 2.5 0 1 1 3.237 3.237c-.464.18-.894.527-.967 1.02Z"/>',
smile:'<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01"/><path d="M15 9h.01"/>',
heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
arrow:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
check:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
tick:'<path d="M20 6 9 17l-5-5"/>',
down:'<path d="m6 9 6 6 6-6"/>',
clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
spark:'<path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2Z"/>'
};
const I=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24">${P[n]}</svg>`;
const B=(n,c='')=>`<span class="badge ${c}">${I(n)}</span>`;
const q=new URLSearchParams(location.search),V=q.get("v")||"A",S=q.get('s')||'home';document.body.className=V;
const nav=`<div class="nav"><div class="logo"><span class="mark">${I('heart')}</span>베이비 AI터</div><div class="menu"><a class="${S=='home'?'on':''}">${I('home')}홈</a><a class="${S=='result'?'on':''}">${I('list')}질문 검사</a><a>${I('clock')}기록</a></div><button class="btn">검사 시작하기 ${I('arrow')}</button></div>`;
const steps=`<div class="steps">${[['list','상황 답하기','대상·직전 상황·컨디션 8문항'],['search','원인 후보 확인','우리 아이 답변으로 본 이유'],['book','근거·대응 보기','기관 자료·쪽수와 대응 2~3줄']].map(s=>`<div class="card step">${B(s[0])}<div><b>${s[1]}</b><span class="muted small">${s[2]}</span></div></div>`).join('')}</div>`;
const recent=`<div class="sec"><h3>최근 검사</h3><span class="muted small">전체 기록 보기 →</span></div><div class="recent">${[['users','10-30','관심 끌기 · 환경 변화','일부 맞음'],['msg','10-29','좌절·표현 부족 · 피로','맞음'],['moon','10-28','피로·컨디션','답변 전']].map(r=>`<div class="card rc">${B(r[0],'sm')}<div style="flex:1"><div class="muted small">${r[1]}</div><div class="t">${r[2]}</div></div><span class="pill">${r[3]}</span></div>`).join('')}</div>`;
const disc=`<div class="disc">${I('info')}진단이 아닌 이해를 돕는 안내예요. 걱정이 계속되면 소아청소년과·육아종합지원센터에 상담하세요.</div>`;
const nodes=[['msg',50,0,'표현'],['moon',93,25,'피로'],['home',93,75,'환경'],['puzzle',50,100,'놀이'],['smile',7,75,'탐색'],['users',7,25,'관심']];
const qprev=`<div class="card q"><div class="row" style="justify-content:space-between"><span class="muted small">2 / 8 · 도윤 · 38개월</span><span class="pill">${I('clock')} 약 1분</span></div><div class="bar"><i></i></div><b style="font-size:20px">깨물기 바로 전, 어떤 일이 있었나요?</b>${[['puzzle','놀잇감을 가져가거나 만졌어요',1],['shield','스스로 하려던 일을 제지했어요'],['smile','놀이에 흥분하거나 따라 했어요'],['info','잘 모르겠어요']].map(o=>`<div class="opt ${o[2]?'on':''}">${B(o[0],'sm')}${o[1]}${o[2]?`<span class="chk">${I('tick')}</span>`:''}</div>`).join('')}</div>`;
const home={
A:`<div class="wrap"><div class="hero"><div><span class="pill">${I('book')} 공공기관 자료 기반</span><h1>아이가 깨물었을 때,<br><b><em>왜 그랬는지</em></b> 먼저.</h1><p class="lead">질문 8개에 답하면 공공기관 자료에 근거한 원인 후보와 대응 방법을 한 번에 보여 드려요.</p><div class="muted small" style="margin:24px 0 8px">누구를 깨물었나요?</div><span class="chip on">${I('users')}친구</span><span class="chip">${I('baby')}동생</span><span class="chip">잘 모르겠어요</span><div class="row" style="margin-top:16px"><button class="btn">검사 시작하기 ${I('arrow')}</button><button class="btn ghost">지난 기록</button></div></div>
<div class="orbit"><div class="ring"></div><div class="ring in"></div><div class="core"><div><div class="muted small">우리 아이</div><b>도윤 · 38개월</b></div></div>${nodes.map(n=>`<div class="node" style="left:${n[1]}%;top:${n[2]}%">${B(n[0])}<span class="lbl">${n[3]}</span></div>`).join('')}</div></div>${steps}${recent}${disc}</div>`,
B:`<div class="wrap"><div class="hero"><div><span class="pill">${I('book')} 공공기관 자료 기반</span><h1>깨문 이유,<br><em>질문 8개</em>로 찾아요</h1><p class="lead">검색하며 헤매지 않아도 돼요. 상황에 답하면 가능성 높은 원인 후보와 근거 출처를 정리해 드려요.</p><div class="row" style="margin-top:24px"><button class="btn">검사 시작하기 ${I('arrow')}</button><button class="btn ghost">기록 보기</button></div><div class="row" style="gap:32px;margin-top:32px">${[['list','8','질문'],['search','7','원인 유형'],['book','5','근거 자료']].map(s=>`<div class="row">${B(s[0],'sm')}<div><b style="font-size:20px">${s[1]}</b> <span class="muted small">${s[2]}</span></div></div>`).join('')}</div></div>${qprev}</div>${recent}${disc}</div>`,
C:`<div class="wrap"><div class="hero"><div><span class="pill">${I('spark')} AI 원인 분석</span><h1 style="font-size:46px">우리 아이 깨물기,<br><em>AI가 근거로</em> 풀어 드려요</h1><p class="lead">질문 8개에 답하면 공공기관 자료만 근거로 원인 후보와 대응법을 정리해요.</p><div class="row" style="margin-top:24px"><button class="btn">검사 시작하기 ${I('arrow')}</button><button class="btn ghost">어떻게 작동하나요?</button></div></div>
<div class="stage"><div class="card" style="position:absolute;left:24px;top:32px;width:340px"><div class="row" style="margin-bottom:12px">${B('msg','sm')}<div><div class="muted small">AI 분석 · 도윤 38개월</div><b>좌절·표현 부족</b></div></div><div class="why" style="margin:0 0 12px">놀잇감을 친구가 만졌고, 원하는 걸 말로 표현하기 어려웠을 수 있어요.</div><div class="src">${I('book')}보건복지부·육아정책연구소 지침서 p.227</div></div><div class="float" style="right:0;top:0">${I('users')}친구를 깨물었어요</div><div class="float" style="right:16px;top:280px">${I('book')}공공기관 자료만 사용</div><div class="float" style="left:0;top:320px">${I('shield')}진단이 아니에요</div></div></div>${steps}${disc}</div>`};
const causes=[['msg','좌절·표현 부족','놀잇감을 친구가 만졌고, 원하는 것을 말로 표현하기 어려워 답답했을 수 있어요.',['“놀잇감을 만지는 게 싫었구나”처럼 마음을 읽어 주세요.','물면 안 된다고 낮은 목소리로 알려 주세요.','“내가 놀고 있어”라고 말하도록 도와주세요.'],'보건복지부·육아정책연구소 · 보육교사 지침서 · p.227'],
['moon','피로·컨디션','깨물기 직전 피곤하거나 졸려 해서 기분이 불편했을 수 있어요.',['수면·식사·놀이 일과를 규칙적으로 유지해 주세요.','언제 깨무는지, 피곤하거나 아픈지 살펴봐 주세요.'],'미국 CHLA Early Connections · p.1'],
