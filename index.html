<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>베이비 AI터</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#FAF6F0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" />
  <link rel="stylesheet" href="css/styles.css?v=feedback-FD1" />
  <script defer src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <header class="app-header"><div class="header-inner"><div class="header-left"><a class="brand" href="#home" data-reset-demo>베이비 AI터</a><nav aria-label="상단 메뉴"><a href="#home" data-desktop-tab="home">홈</a><a href="#ask" data-desktop-tab="ask">질문 검사</a><a href="#log" data-desktop-tab="log">기록</a></nav></div><button class="profile-button" id="editProfile" type="button" aria-label="아이 정보 수정"><span id="profileSummary"></span><i data-lucide="pencil"></i></button></div></header>
  <div class="app">
    <section class="screen" data-screen="home">
      <header class="topbar"><h1 data-reset-demo>베이비 AI터</h1></header>
      <main class="content">
        <div class="home-hero"><div class="hero-copy"><h2>아이가 깨물었을 때,<br><span class="highlight">왜 그랬는지 먼저.</span></h2><p class="hero-lead">질문 8개에 답하면 공공기관 자료에 근거한 원인 후보와 대응 방법을 한 번에 보여 드려요.</p><button class="btn btn-primary" type="button" data-start-quiz>검사 시작하기 <i data-lucide="arrow-right"></i></button><p class="hero-notes">· 공공기관 자료 근거 <span>· 진단이 아닌 안내</span><span>· 기록은 이 기기에만 저장</span></p></div><div class="playful-art" aria-hidden="true"><div class="baby-shape"><i data-lucide="baby"></i></div><div class="play-shape expression"><div><i data-lucide="message-circle"></i></div><span id="homeExpression"></span></div><div class="play-shape fatigue"><span id="homeCondition"></span><div><i data-lucide="moon"></i></div></div><div class="play-shape environment"><div><i data-lucide="house"></i></div><span id="homeChange"></span></div></div></div>
        <section class="home-records"><div class="section-head"><h2 class="title-md"><i data-lucide="clock"></i>최근 검사</h2><a href="#log">전체 기록 보기 →</a></div><div id="homeRecent" class="recent-list"></div></section>
        <p class="home-disclaimer muted"><i data-lucide="info"></i>진단이 아닌 이해를 돕는 안내예요.</p>
      </main>
    </section>
    <section class="screen" data-screen="ask" hidden>
      <header class="topbar"><h1>깨물기 상황 질문</h1></header>
      <main class="content">
        <form id="askForm">
          <p class="muted section" id="askAge"></p>
          <div id="questionContent" aria-live="polite"></div>
          <div class="field" id="quizNote" hidden><label class="label" for="askText">추가 메모 (선택)</label><input class="input" id="askText" maxlength="300" placeholder="특별한 상황이 있으면 적어 주세요" /></div>
          <div class="section"><button class="btn btn-secondary" id="quizBack" type="button" hidden>이전 질문</button></div>
          <button class="btn btn-primary btn-block" id="quizNext" type="button" disabled>다음</button>
          <button class="btn btn-primary btn-block" id="quizSubmit" type="submit" hidden>원인 후보 보기</button>
        </form>
      </main>
    </section>
    <section class="screen" data-screen="result" hidden>
      <header class="topbar"><a class="icon-btn" href="#ask" aria-label="뒤로"><i data-lucide="chevron-left"></i></a><h1>결과</h1></header>
      <main class="content" id="resultContent"><div class="empty"><p>아직 검사 결과가 없어요</p><a class="btn btn-secondary" href="#ask">질문 검사</a></div></main>
    </section>
    <section class="screen" data-screen="log" hidden>
      <header class="topbar"><h1>기록</h1></header>
      <main class="content"><h2 class="desktop-page-title">검사 기록</h2><div id="logContent"></div></main>
    </section>
    <nav class="tabbar" id="tabbar" aria-label="주 메뉴">
      <a href="#home" data-tab="home"><i data-lucide="house"></i>홈</a>
      <a href="#ask" data-tab="ask"><i data-lucide="message-circle"></i>질문 검사</a>
      <a href="#log" data-tab="log"><i data-lucide="list"></i>기록</a>
    </nav>
  </div>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet"><div id="sheetBody"></div><button class="btn btn-ghost btn-block" id="sheetClose">닫기</button></div>
  <div class="toast" id="toast"></div>
  <script defer src="js/knowledge.js?v=feedback-FD1"></script>
  <script defer src="js/config.js?v=feedback-FD1"></script>
  <script defer src="js/questions.js?v=feedback-FD1"></script>
  <script defer src="js/ai.js?v=feedback-FD1"></script>
  <script defer src="js/app.js?v=feedback-FD1"></script>
</body>
</html>
